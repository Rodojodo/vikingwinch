services:
  db:
    image: mysql:8.0
    container_name: vgs_mysql_mock
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vgs_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      MSAL_ISSUER: ${MSAL_ISSUER}
      MSAL_AUDIENCE: ${MSAL_AUDIENCE}
      MSAL_JWKS_URL: ${MSAL_JWKS_URL}
      AUTH_SQUADRON_CLAIM: ${AUTH_SQUADRON_CLAIM:-squadronId}
      AUTH_OPERATOR_CLAIM: ${AUTH_OPERATOR_CLAIM:-employeeId}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - db

volumes:
  mysql_data:
