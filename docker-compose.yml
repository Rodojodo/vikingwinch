services:
  db:
    image: mysql:8.0
    container_name: vgs_mysql_mock
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-localdev_root}
      MYSQL_DATABASE: ${DB_NAME:-vgs_management}
      MYSQL_USER: ${DB_USER:-vgs_api}
      MYSQL_PASSWORD: ${DB_PASSWORD:-localdev_api}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vgs_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER:-vgs_api}
      DB_PASSWORD: ${DB_PASSWORD:-localdev_api}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-vgs_management}
    depends_on:
      - db

volumes:
  mysql_data:
